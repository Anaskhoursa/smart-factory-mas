
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-factory-mas"
version = "0.1.0"
description = "An event-driven Industry 4.0 factory simulator"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]
predictive = [
    "numpy>=1.26",
    "torch>=2.2",
    "paho-mqtt>=2.1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]